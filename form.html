<!DOCTYPE html>
<html>
<head>
    <title>Donor Information Form</title>
</head>
<body>

<form>
    <fieldset>
        <legend>Donor Information</legend>

        <label>First Name*</label>
        <input type="text" name="firstname" required>
        <br><br>

        <label>Last Name*</label>
        <input type="text" name="lastname" required>
        <br><br>

        <label>Company</label>
        <input type="text" name="company">
        <br><br>

        <label>Address 1*</label>
        <input type="text" name="address1" required>
        <br><br>

        <label>Address 2:</label>
        <input type="text" name="address2">
        <br><br>

        <label>City*</label>
        <input type="text" name="city" required>
        <br><br>

        <label>State*</label>
       <select name="state" >
            <option>Select a State</option>
            <option>Dhaka</option>
            <option>Chittagong</option>
            <option>Rajshahi</option>
        </select>
        <br><br>

        <label>Zip Code*</label>
        <input type="text" name="zipcode" required>
        <br><br>

        <label>Country*</label>
        <select name="country" >
            <option>Select a Country</option>
            <option>Bangladesh</option>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
        </select>
        <br><br>

        <label>Phone</label>
        <input type="tel" name="phone">
        <br><br>

        <label>Fax</label>
        <input type="text" name="fax">
        <br><br>

        <label>Email*</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Donation Amount*</label>
        <input type="radio" name="donation" value="none" checked> None
        <input type="radio" name="donation" value="50"> $50
        <input type="radio" name="donation" value="75"> $75
        <input type="radio" name="donation" value="100"> $100
        <input type="radio" name="donation" value="250"> $250
        <input type="radio" name="donation" value="other"> Other
        <br><br>

        <label>Other Amount $</label>
        <input type="number" name="otheramount">
        <br><br>

        <label>Recurring Donation</label>
        <input type="checkbox" name="recurring">
        I am interested in giving on a regular basis.
        <br><br>

        <label>Monthly Credit Card $</label>
        <input type="number" name="monthlyamount">
        For
        <input type="number" name="months">
        Months
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </fieldset>
</form>

</body>
</html>
